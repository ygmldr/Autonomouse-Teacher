[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "autoteacher-m0"
version = "0.1.0"
description = "Offline-first Autonomous Teacher DSH feasibility evidence"
requires-python = ">=3.11,<3.12"
dependencies = [
  "deepseek-harness-sdk==0.2.2rc2",
  "pydantic>=2.12,<3",
  "PyYAML>=6,<7",
  "python-dotenv>=1,<2",
  "httpx>=0.28,<1",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "hatchling==1.30.1"]

[project.scripts]
at-m0 = "autoteacher_m0.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autoteacher_m0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: requires independent human approval and separate credential injection"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
